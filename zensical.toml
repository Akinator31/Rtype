# Documentation site configuration (https://zensical.org)
#
# Adding a page: create the .md file under docs/ and list it in `nav` below.
# `scripts/check_docs_nav.py` (run by the CI) fails if a page is missing from `nav`.

[project]
site_name = "R-Type"
site_description = "Networked R-Type clone built on our own C++ game engine"
site_url = "https://akinator31.github.io/Rtype/"
repo_url = "https://github.com/Akinator31/Rtype"
repo_name = "Akinator31/Rtype"
edit_uri = "edit/main/docs/"
copyright = "R-Type team — Epitech B-CPP-500"

nav = [
    { "Home" = "index.md" },
    { "Getting started" = [
        "getting-started/index.md",
        "getting-started/build.md",
    ] },
    { "Architecture" = [
        "architecture/index.md",
        "architecture/ecs.md",
        "architecture/networking-concepts.md",
        "architecture/rendering.md",
        "architecture/input.md",
        "architecture/localization.md",
        "architecture/settings.md",
        "architecture/database.md",
        "architecture/logging.md",
        "architecture/networking.md",
        "architecture/server.md",
        "architecture/game.md",
        "architecture/client-game.md",
        "architecture/client-online.md",
        "architecture/audio.md",
        "architecture/scenes-and-interface.md",
        "architecture/threads.md",
    ] },
    { "Guides" = [
        "guides/index.md",
        "guides/write-a-system.md",
        "guides/draw-a-sprite.md",
        "guides/add-a-menu.md",
        "guides/add-a-player-action.md",
        "guides/add-a-network-message.md",
        "guides/configure-enemies-and-weapons.md",
        "guides/script-enemy-behaviors.md",
        "guides/generate-the-server-keys.md",
        "guides/run-a-server.md",
    "guides/use-an-external-database.md",
        "guides/play-online.md",
    ] },
    { "Network protocol" = [
        "protocol/index.md",
        "protocol/lobby.md",
        "protocol/game.md",
        "protocol/instances.md",
    ] },
    { "Technical decisions" = [
        "decisions/index.md",
        "decisions/0001-cpm-package-manager.md",
        "decisions/0002-raylib-graphics-library.md",
        "decisions/0003-documentation-tooling.md",
        "decisions/0004-testing-tools.md",
        "decisions/0005-world-in-ecs-interface-in-ui-layer.md",
        "decisions/0006-ecs-component-storage.md",
        "decisions/0007-client-in-the-ecs.md",
        "decisions/0008-events-switch-systems.md",
        "decisions/0009-named-scenes-in-the-engine.md",
        "decisions/0010-physics-engine.md",
        "decisions/0011-networking-library.md",
        "decisions/0012-tcp-lobby-udp-game.md",
        "decisions/0013-one-process-per-game.md",
        "decisions/0014-encryption.md",
        "decisions/0015-one-game-scene-local-or-remote-session.md",
        "decisions/0016-replication.md",
        "decisions/0017-asset-loading-threads.md",
        "decisions/0018-lua-game-config.md",
        "decisions/0019-luabridge3-scripting-library.md",
        "decisions/0020-server-key-distribution.md",
        "decisions/0021-server-generated-key-trust-on-first-use.md",
        "decisions/0022-engine-thread-manager.md",
        "decisions/0023-server-database.md",
    ] },
    { "Accessibility" = "accessibility.md" },
    { "Contributing" = [
        "contributing/index.md",
        "contributing/testing.md",
        "contributing/documentation.md",
        "contributing/releasing.md",
        "contributing/templates.md",
        "contributing/repository-setup.md",
    ] },
    { "API reference" = "reference/index.md" },
]

[project.theme]
language = "en"
features = [
    "content.action.edit",
    "content.code.annotate",
    "content.code.copy",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[project.theme.icon]
logo = "lucide/rocket"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "deep-orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "deep-orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/Akinator31/Rtype"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
