# The official server in Dokploy, with its accounts (docs/guides/deploy-with-docker.md).
#
# The lobby and the games are published on the host: 4242 over TCP, and 4242 over UDP for every game, the same
# number inside and outside, since the lobby gives the players the port of their game. The panel listens on
# port 8080 of the container and is never published: Traefik reaches it over the network of Dokploy, at the
# domain given to the service.
#
# Its settings (docker/server-accounts.toml) and its secrets are files of the service, which Dokploy keeps in
# ../files; RTYPE_FILES points elsewhere without Dokploy. Each secret is readable by the user of the server,
# 10001, and nobody else.

services:
  server:
    image: ${RTYPE_IMAGE:-ghcr.io/akinator31/rtype:latest}
    restart: unless-stopped
    # A small init as PID 1: it hands SIGTERM to the master, and reaps what it would not
    init: true
    ports:
      - "4242:4242/tcp"
      - "4242:4242/udp"
    # The panel, for Traefik only
    expose:
      - "8080"
    volumes:
      - data:/data
      - ${RTYPE_FILES:-../files}/server.toml:/config/server.toml:ro
    secrets:
      - mail_password
      - discord_secret
    # The time to end the games properly before Docker kills the master
    stop_grace_period: 30s

secrets:
  mail_password:
    file: ${RTYPE_FILES:-../files}/mail_password
  discord_secret:
    file: ${RTYPE_FILES:-../files}/discord_secret

volumes:
  data:
