version: 2.1

# Port of the GitHub Actions workflows (.github/workflows) to a single CircleCI pipeline. Kept here while CircleCI
# is disabled: to enable it again, move this folder back to .circleci/ (the paths below name .circleci/).
#
# The pipeline has three triggers (Project Settings > Triggers):
#   - "All pushes": panel, build, sanitizers, Docker image, format and docs on every branch; mirror and docs
#     deployment on main; Docker publication from main and the v* tags; release on the v* tags
#   - "PR opened": format and docs as soon as a pull request is opened, before any new push
#   - A schedule on main, every night at 05:01 UTC, with the pipeline parameter nightly-tsan = true: the whole
#     suite under ThreadSanitizer, as tsan.yml (a night that failed blocks the next release)
#
# Project environment variables (Project Settings > Environment Variables):
#   FORMAT_BOT_CLIENT_ID, FORMAT_BOT_PRIVATE_KEY  format bot (also used to deploy the docs and publish releases)
#   MIRROR_URL, GIT_SSH_PRIVATE_KEY                mirror repository
#   GHCR_USER, GHCR_TOKEN                          GHCR publication of the server image: GHCR takes no token of a
#                                                  GitHub App, so a personal access token (classic) with
#                                                  write:packages, and the login of its owner
#   CIRCLECI_API_TOKEN                             a personal API token of CircleCI: the release reads the last
#                                                  ThreadSanitizer night through the Insights API
#   CIRCLECI_PROJECT_SLUG                          optional, gh/<owner>/<name> by default: the slug of the project
#                                                  of a GitHub App integration, circleci/<org id>/<project id>
# Multi-line values (.pem, SSH key) can be stored encoded with base64 -w0.
#
# The documentation is deployed by pushing the gh-pages branch: GitHub Pages must then serve that branch
# (Settings > Pages > Source: Deploy from a branch), not "GitHub Actions" as the GitHub workflow needs.

parameters:
  nightly-tsan:
    description: Set by the nightly schedule, or by hand from "Trigger pipeline", to run ThreadSanitizer only
    type: boolean
    default: false

executors:
  linux:
    docker:
      - image: cimg/base:2026.03-24.04
  # The build of Linux with its PostgreSQL: the tests of the database run on SQLite and on this server, as on
  # the GitHub runner. Windows tests SQLite only
  linux-postgresql:
    docker:
      - image: cimg/base:2026.03-24.04
      - image: postgres:18
        environment:
          POSTGRES_USER: rtype
          POSTGRES_PASSWORD: rtype
          POSTGRES_DB: rtype
    environment:
      RTYPE_TEST_POSTGRESQL_URL: postgresql://rtype:rtype@127.0.0.1:5432/rtype
  python:
    docker:
      - image: cimg/python:3.13
  # A virtual machine: Docker for PostgreSQL and the images, and setarch -R, which the seccomp profile of a
  # container refuses
  vm:
    machine:
      image: ubuntu-2404:current
  # The two architectures of the published image, each built natively
  vm-amd64:
    machine:
      image: ubuntu-2404:current
  vm-arm64:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.medium
  windows:
    machine:
      image: windows-server-2022-gui:current
    resource_class: windows.medium
    shell: bash.exe

commands:
  set-repo-slug:
    description: Export GITHUB_REPOSITORY (owner/name), read from the origin remote
    steps:
      - run:
          name: Find the GitHub repository
          command: |
            slug=$(git remote get-url origin | sed -E 's#^(git@github\.com:|https://github\.com/)##; s#\.git$##')
            echo "export GITHUB_REPOSITORY='$slug'" >> "$BASH_ENV"
            echo "Repository: $slug"

  install-gh:
    description: Install the GitHub CLI
    steps:
      - run:
          name: Install GitHub CLI
          environment:
            GH_VERSION: 2.63.0
          command: |
            curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" \
              | tar -xz -C /tmp
            sudo mv "/tmp/gh_${GH_VERSION}_linux_amd64/bin/gh" /usr/local/bin/gh
            gh --version

  # The latest LTS of Node, as setup-node with lts/*
  install-node:
    description: Install the latest LTS of Node
    steps:
      - run:
          name: Install Node (LTS)
          command: |
            version=$(curl -fsSL https://nodejs.org/dist/index.json | jq -r '[.[] | select(.lts != false)][0].version')
            curl -fsSL "https://nodejs.org/dist/${version}/node-${version}-linux-x64.tar.gz" \
              | sudo tar -xz -C /usr/local --strip-components=1
            node --version
            npm --version

  npm-ci:
    description: Install the dependencies of the panel, with the npm cache of its lock file
    steps:
      - restore_cache:
          name: Restore npm cache
          keys:
            - npm-{{ checksum "web/admin/package-lock.json" }}
      - run:
          name: Install the dependencies of the panel
          working_directory: web/admin
          command: npm ci
      - save_cache:
          name: Save npm cache
          key: npm-{{ checksum "web/admin/package-lock.json" }}
          paths:
            - ~/.npm

  # Equivalent of the GitHub "paths" filter: the job stops (successfully) when no matching file changed.
  # Pushes to main are compared with the previous commit, other branches with their merge base with main.
  skip-unless-changed:
    parameters:
      paths:
        description: Extended regex matched against the changed file paths
        type: string
    steps:
      - run:
          name: Skip when no relevant file changed
          environment:
            EVENT: << pipeline.event.name >>
            BRANCH: << pipeline.git.branch >>
            PATHS: << parameters.paths >>
          command: |
            case "$EVENT" in
              push|pull_request) ;;
              *) echo "Triggered by '$EVENT': no path filter."; exit 0 ;;
            esac
            if [ "$BRANCH" = "main" ]; then
              base=$(git rev-parse -q --verify HEAD^1 || true)
            else
              git fetch -q origin main
              base=$(git merge-base FETCH_HEAD HEAD || true)
            fi
            if [ -z "$base" ]; then
              echo "No commit to compare with: running."
              exit 0
            fi
            if git diff --name-only "$base" HEAD | grep -Eq "$PATHS"; then
              echo "Relevant files changed since ${base:0:7}: running."
            else
              echo "No relevant file changed since ${base:0:7}: skipping."
              circleci-agent step halt
            fi

  # Only the dependency declarations and CPM itself: hashing every CMakeLists.txt saved a new cache (counted
  # in the storage of the plan) each time a source file was added
  restore-cpm-cache:
    parameters:
      platform:
        type: string
    steps:
      - run:
          name: Compute the dependency cache key
          command: |
            git grep -h -A8 'CPMAddPackage' -- '*CMakeLists.txt' 'cmake/*.cmake' ':!cmake/CPM.cmake' > .cpm-cache-key
            git hash-object cmake/CPM.cmake >> .cpm-cache-key
      - restore_cache:
          name: Restore dependency cache
          keys:
            - cpm-<< parameters.platform >>-{{ checksum ".cpm-cache-key" }}
            - cpm-<< parameters.platform >>-

  install-linux-libraries:
    description: The system libraries of the build (X11 / OpenGL, OpenSSL, libpq, Discord) and extra packages
    parameters:
      extra:
        type: string
        default: ""
    steps:
      # The Discord Social SDK of the client (libs/discord) is linked against PulseAudio and ALSA
      - run:
          name: Install build tools and system libraries (X11 / OpenGL, OpenSSL, libpq, Discord)
          command: |
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              build-essential cmake ninja-build \
              libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libssl-dev libpq-dev \
              libpulse0 libasound2t64 \
              << parameters.extra >>

  cmake-build:
    description: Configure, build, test and package the project, as the GitHub Build workflow
    parameters:
      platform:
        type: string
      generator:
        type: string
      after-test:
        description: Steps run between the tests and the package, such as the end-to-end tests of the panel
        type: steps
        default: []
    steps:
      - checkout
      # The panel of the panel job: the package takes it, the end-to-end tests serve it
      - attach_workspace:
          at: .
      - restore-cpm-cache:
          platform: << parameters.platform >>
      - run:
          name: Configure
          command: |
            [ -d "/c/Program Files/CMake/bin" ] && export PATH="/c/Program Files/CMake/bin:$PATH"
            [ -f ~/msvc-env.sh ] && . ~/msvc-env.sh
            root=$(command -v cygpath > /dev/null && cygpath -m "$PWD" || echo "$PWD")
            cmake -S . -B build -G "<< parameters.generator >>" \
              -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DRTYPE_BUILD_TESTS=ON \
              -DRTYPE_ADMIN_PANEL_DIR="$root/web/admin/dist" \
              -DCPM_SOURCE_CACHE="$root/.cpm-cache"
      - run:
          name: Build
          command: |
            [ -d "/c/Program Files/CMake/bin" ] && export PATH="/c/Program Files/CMake/bin:$PATH"
            [ -f ~/msvc-env.sh ] && . ~/msvc-env.sh
            cmake --build build --config $BUILD_TYPE --parallel
      - run:
          name: Test
          command: |
            [ -d "/c/Program Files/CMake/bin" ] && export PATH="/c/Program Files/CMake/bin:$PATH"
            ctest --test-dir build -C $BUILD_TYPE --output-on-failure
      - steps: << parameters.after-test >>
      - run:
          name: Package
          working_directory: build
          command: |
            [ -d "/c/Program Files/CMake/bin" ] && export PATH="/c/Program Files/CMake/bin:$PATH"
            cpack -C $BUILD_TYPE
      # Saved from main only (the retention of the free plan is fixed): branches restore the cache of main through
      # the fallback key, and a branch adding a dependency downloads it until it is merged
      - when:
          condition:
            equal: [main, << pipeline.git.branch >>]
          steps:
            - save_cache:
                name: Save dependency cache
                key: cpm-<< parameters.platform >>-{{ checksum ".cpm-cache-key" }}
                paths:
                  - .cpm-cache
      - run:
          name: Collect packages
          command: |
            shopt -s nullglob
            files=(build/r-type-*.zip build/r-type-*.tar.gz)
            if [ ${#files[@]} -eq 0 ]; then
              echo "No package found in build/."
              exit 1
            fi
            mkdir -p packages
            cp "${files[@]}" packages/
            ls -l packages
      # No CircleCI artifacts: they count towards the storage of the plan and cannot be deleted before their
      # retention ends. The packages are only kept for the release job, which reads them from the workspace
      - when:
          condition:
            not:
              equal: ["", << pipeline.git.tag >>]
          steps:
            - persist_to_workspace:
                root: .
                paths:
                  - packages

  docker-login:
    description: Log in to GHCR and export IMAGE, the name of the image there
    steps:
      - run:
          name: Log in to GHCR
          command: |
            if [ -z "${GHCR_USER:-}" ] || [ -z "${GHCR_TOKEN:-}" ]; then
              echo "GHCR_USER and GHCR_TOKEN are not set (Project Settings > Environment Variables): cannot publish."
              exit 1
            fi
            echo "export IMAGE='ghcr.io/${GITHUB_REPOSITORY,,}'" >> "$BASH_ENV"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

jobs:
  # The administration panel (web/admin): its own toolchain, Node LTS, apart from the game. Its dist/ goes into
  # the server package of each system; the game itself builds without Node
  panel:
    executor: linux
    steps:
      - checkout
      - install-node
      - npm-ci
      - run:
          name: Lint
          working_directory: web/admin
          command: |
            npm run lint
            npm run format:check
      - run:
          name: Type-check
          working_directory: web/admin
          command: npm run typecheck
      - run:
          name: Test
          working_directory: web/admin
          command: npm test
      - run:
          name: Build
          working_directory: web/admin
          command: npm run build
      - persist_to_workspace:
          root: .
          paths:
            - web/admin/dist

  build-linux:
    executor: linux-postgresql
    environment:
      BUILD_TYPE: Release
    steps:
      # The second line is what the Chromium of Playwright needs, for the end-to-end tests of the panel: named
      # here since `playwright install --with-deps` runs `sudo sh`, and knows only the packages of Ubuntu
      - install-linux-libraries:
          extra: >-
            libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libdbus-1-3 libxkbcommon0
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libatspi2.0-0t64
      - install-node
      - run:
          name: Wait for PostgreSQL
          command: |
            # Over TCP: while it initializes, the image runs a server on its Unix socket only, then restarts it
            for attempt in $(seq 1 30); do
              (exec 3<> /dev/tcp/127.0.0.1/5432) 2> /dev/null && { echo "PostgreSQL is up."; exit 0; }
              sleep 1
            done
            echo "PostgreSQL did not start."
            exit 1
      - cmake-build:
          platform: linux
          generator: Ninja
          # The panel against the master just built and a game of real players
          after-test:
            - npm-ci
            - run:
                name: End-to-end tests of the panel
                working_directory: web/admin
                # A failure is told by the next step: this one keeps going, so that the report is stored. The
                # report of a run that passed is removed, as it would count towards the storage of the plan
                command: |
                  export RTYPE_BUILD_BIN="$(cd ../.. && pwd)/build/bin"
                  npx playwright install chromium
                  if npx playwright test; then
                    rm -rf playwright-report
                  else
                    touch /tmp/e2e-failed
                  fi
            - store_artifacts:
                name: Keep the report of the end-to-end tests (failures only)
                path: web/admin/playwright-report
                destination: playwright-report
            - run:
                name: Fail on a failed end-to-end test
                command: |
                  if [ -f /tmp/e2e-failed ]; then
                    echo "The end-to-end tests of the panel failed: see the playwright-report artifact."
                    exit 1
                  fi

  build-windows:
    executor: windows
    environment:
      BUILD_TYPE: Release
    steps:
      - run:
          name: Install CMake and Ninja if missing
          command: |
            [ -d "/c/Program Files/CMake/bin" ] && export PATH="/c/Program Files/CMake/bin:$PATH"
            if ! command -v cmake > /dev/null; then
              choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y --no-progress
            fi
            if ! command -v ninja > /dev/null; then
              choco install ninja -y --no-progress
            fi
      # Ninja (for its [n/total] progress, as on Linux) needs the MSVC environment that vcvars64.bat sets up in cmd:
      # it is saved to ~/msvc-env.sh, which the configure and build steps load
      - run:
          name: Load the MSVC environment
          command: |
            set -o pipefail
            shopt -s nullglob
            # Any edition of Visual Studio 2022, else wherever vswhere finds the C++ tools
            vcvars=("/c/Program Files/Microsoft Visual Studio/2022/"*/VC/Auxiliary/Build/vcvars64.bat
              "/c/Program Files (x86)/Microsoft Visual Studio/2022/"*/VC/Auxiliary/Build/vcvars64.bat)
            if [ ${#vcvars[@]} -eq 0 ]; then
              vs=$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' \
                -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | tr -d '\r')
              [ -n "$vs" ] && vcvars=("$(cygpath -u "$vs")/VC/Auxiliary/Build/vcvars64.bat")
            fi
            if [ ${#vcvars[@]} -eq 0 ] || [ ! -f "${vcvars[0]}" ]; then
              echo "vcvars64.bat not found: are the Visual Studio C++ tools installed?"
              exit 1
            fi
            echo "Using ${vcvars[0]}"
            printf '@call "%s" > nul || exit /b 1\r\n@set\r\n' "$(cygpath -w "${vcvars[0]}")" > ~/vcvars-env.bat
            cmd.exe //c "$(cygpath -w ~/vcvars-env.bat)" | tr -d '\r' > ~/vcvars-env.txt
            rm ~/vcvars-env.bat
            : > ~/msvc-env.sh
            while IFS='=' read -r name value; do
              case "$name" in
                # cmd spells it Path
                Path|PATH) name=PATH value=$(cygpath -u -p "$value") ;;
                INCLUDE|LIB|LIBPATH|VSINSTALLDIR|VCINSTALLDIR|VCToolsInstallDir|WindowsSdkDir|WindowsSDKVersion|UCRTVersion|UniversalCRTSdkDir) ;;
                *) continue ;;
              esac
              printf 'export %s=%q\n' "$name" "$value" >> ~/msvc-env.sh
            done < ~/vcvars-env.txt
            rm ~/vcvars-env.txt
            . ~/msvc-env.sh
            command -v cl
      - cmake-build:
          platform: windows
          generator: Ninja

  # The whole suite under AddressSanitizer and UndefinedBehaviorSanitizer on every branch, or ThreadSanitizer
  # from the nightly schedule, as sanitizers.yml
  sanitizers:
    executor: vm
    parameters:
      sanitizers:
        description: Sanitizers of the build, as RTYPE_SANITIZERS
        type: string
    environment:
      # Optimized as the release, with what the reports need to name the lines
      BUILD_TYPE: RelWithDebInfo
      SANITIZERS: << parameters.sanitizers >>
    steps:
      - checkout
      - install-linux-libraries
      - run:
          name: Start PostgreSQL for the tests
          command: |
            docker run -d --name rtype-ci-postgres -e POSTGRES_USER=rtype -e POSTGRES_PASSWORD=rtype \
              -e POSTGRES_DB=rtype -p 127.0.0.1:5432:5432 postgres:18
            # Over TCP: while it initializes, the image runs a server on its Unix socket only, then restarts it
            for attempt in $(seq 1 30); do
              docker exec rtype-ci-postgres pg_isready -h 127.0.0.1 -U rtype -d rtype > /dev/null 2>&1 && break
              sleep 1
            done
            docker exec rtype-ci-postgres pg_isready -h 127.0.0.1 -U rtype -d rtype
            echo "export RTYPE_TEST_POSTGRESQL_URL=postgresql://rtype:rtype@127.0.0.1:5432/rtype" >> "$BASH_ENV"
      - restore-cpm-cache:
          platform: linux
      - run:
          name: Configure
          command: |
            cmake -S . -B build-sanitizers -G Ninja \
              -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DRTYPE_BUILD_TESTS=ON -DRTYPE_SANITIZERS=$SANITIZERS \
              -DCPM_SOURCE_CACHE="$PWD/.cpm-cache"
      - run:
          name: Build
          command: cmake --build build-sanitizers --parallel
      # Without the randomization of the addresses: ThreadSanitizer refuses the layouts of the recent kernels
      - run:
          name: Test
          no_output_timeout: 30m
          command: setarch "$(uname -m)" -R ctest --test-dir build-sanitizers --output-on-failure

  # The image of the server (docs/guides/deploy-with-docker.md), built and smoke tested on every branch, as
  # docker.yml
  docker-image:
    executor: vm
    environment:
      SERVER_IMAGE: rtype-server:ci
      SMOKE_IMAGE: rtype-smoke:ci
    steps:
      - checkout
      - run:
          name: Build the image
          command: |
            docker build --target server -t "$SERVER_IMAGE" .
            docker build --target smoke -t "$SMOKE_IMAGE" .
      - run:
          name: Smoke test
          command: docker/smoke-test.sh "$SERVER_IMAGE" "$SMOKE_IMAGE"
      # The settings of the official server, a fake Discord and a fake mail server: a player and an
      # administrator sign in
      - run:
          name: Smoke test with accounts
          command: docker/smoke-test-accounts.sh "$SERVER_IMAGE" "$SMOKE_IMAGE"

  # One architecture of the image, on a machine of its own, pushed by digest only: docker-manifest gathers them.
  # Native arm64 here, where the GitHub runner builds it under QEMU
  docker-publish:
    parameters:
      arch:
        type: enum
        enum: [amd64, arm64]
    executor: vm-<< parameters.arch >>
    steps:
      - checkout
      - set-repo-slug
      - docker-login
      - run:
          name: Build and push linux/<< parameters.arch >>
          command: |
            docker buildx create --name rtype --driver docker-container --use
            docker buildx build --platform linux/<< parameters.arch >> --target server \
              --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
              --metadata-file /tmp/metadata.json .
            mkdir -p /tmp/digests
            jq -r '."containerimage.digest"' /tmp/metadata.json > /tmp/digests/<< parameters.arch >>
            cat /tmp/digests/<< parameters.arch >>
      - persist_to_workspace:
          root: /tmp
          paths:
            - digests/<< parameters.arch >>

  # The image for linux/amd64 and linux/arm64 in one manifest, Dokploy pulls the one of its machine: main as
  # main, a tag as its version and latest (never for a prerelease)
  docker-manifest:
    executor: vm
    environment:
      TAG: << pipeline.git.tag >>
    steps:
      - checkout
      - set-repo-slug
      - docker-login
      - attach_workspace:
          at: /tmp
      - run:
          name: Publish the manifest
          command: |
            if [ -n "$TAG" ]; then
              tags=("${TAG#v}")
              [[ "$TAG" == *-* ]] || tags+=(latest)
            else
              tags=(main)
            fi
            tag_args=()
            for tag in "${tags[@]}"; do
              tag_args+=(-t "$IMAGE:$tag")
            done
            docker buildx imagetools create "${tag_args[@]}" \
              "$IMAGE@$(cat /tmp/digests/amd64)" "$IMAGE@$(cat /tmp/digests/arm64)"
            docker buildx imagetools inspect "$IMAGE:${tags[0]}"
            docker logout ghcr.io

  # On pull requests, unformatted C++ code is fixed automatically: the format bot (a GitHub App, see
  # docs/contributing/repository-setup.md) commits the result to the branch and comments on the pull request.
  # Elsewhere (pushes to main, bot not configured), the job only checks and fails.
  format:
    executor: python
    resource_class: small
    environment:
      BOT_COMMIT_MESSAGE: "style: apply clang-format"
      EVENT: << pipeline.event.name >>
      BRANCH: << pipeline.git.branch >>
    steps:
      - checkout
      - set-repo-slug
      # No path filter on pull requests: the check can then be required by the branch protection of main
      - when:
          condition:
            and:
              - equal: [push, << pipeline.event.name >>]
              - equal: [main, << pipeline.git.branch >>]
          steps:
            - skip-unless-changed:
                paths: '\.(cpp|hpp|h)$|^\.clang-format$|^requirements-dev\.txt$|^\.circleci/'
      - install-gh
      # Commits pushed with this token trigger the pipeline again, so the other workflows check the fix.
      # Pushes to a branch without an open pull request are ignored, as GitHub's pull_request event would.
      - run:
          name: Generate format bot token
          command: |
            if [ "$BRANCH" = "main" ] || [ -z "${FORMAT_BOT_CLIENT_ID:-}" ]; then
              echo "Format bot not used for this run."
              exit 0
            fi
            bash .circleci/scripts/github-app-token.sh
            source "$BASH_ENV"
            pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
            if [ -n "$pr" ]; then
              echo "export PR_NUMBER=$pr" >> "$BASH_ENV"
              echo "Pull request #$pr"
            elif [ "$EVENT" = "push" ]; then
              echo "The branch $BRANCH has no open pull request: nothing to do."
              circleci-agent step halt
            fi
      - restore_cache:
          keys:
            - pip-format-{{ checksum "requirements-dev.txt" }}
      # Same clang-format version for everyone, pinned in requirements-dev.txt
      - run:
          name: Install clang-format
          command: pip install -r requirements-dev.txt
      - save_cache:
          key: pip-format-{{ checksum "requirements-dev.txt" }}
          paths:
            - ~/.cache/pip
      # Tracked C++ files only: submodules and fetched dependencies are left alone
      - run:
          name: Run clang-format
          command: |
            mkdir -p /tmp/format
            clang-format --version
            git ls-files -z '*.cpp' '*.hpp' '*.h' | xargs -0 --no-run-if-empty clang-format -i
            git diff --name-only > /tmp/format/formatted.txt
            if [ -s /tmp/format/formatted.txt ]; then
              echo "Files to reformat:"
              cat /tmp/format/formatted.txt
            else
              echo "All files are correctly formatted."
            fi
      - run:
          name: Fail on unformatted code (no bot available)
          command: |
            if [ ! -s /tmp/format/formatted.txt ] || [ -n "${PR_NUMBER:-}" ]; then
              exit 0
            fi
            if [ -z "${FORMAT_BOT_CLIENT_ID:-}" ] && [ "$BRANCH" != "main" ]; then
              reason="the environment variable FORMAT_BOT_CLIENT_ID is not set (Project Settings > Environment Variables)"
            else
              reason="the run is not attached to a pull request (event: $EVENT, branch: $BRANCH)"
            fi
            echo "Format bot not used: formatting is only checked because $reason."
            git diff
            echo "Some files are not formatted. Run clang-format -i on them (see docs/contributing/testing.md#formatting)."
            exit 1
      # Safety net against an endless loop if clang-format were not idempotent
      - run:
          name: Fail if the bot's own commit is still unformatted
          command: |
            if [ -s /tmp/format/formatted.txt ] && [ -n "${PR_NUMBER:-}" ] \
              && [ "$(git log -1 --format=%s)" = "$BOT_COMMIT_MESSAGE" ]; then
              git diff
              echo "Code is still unformatted after the format bot's commit."
              exit 1
            fi
      - run:
          name: Commit and push the formatted files
          command: |
            if [ ! -s /tmp/format/formatted.txt ] || [ -z "${PR_NUMBER:-}" ]; then
              exit 0
            fi
            bot_id=$(gh api "/users/${BOT_SLUG}[bot]" --jq .id)
            git config user.name "${BOT_SLUG}[bot]"
            git config user.email "${bot_id}+${BOT_SLUG}[bot]@users.noreply.github.com"
            git commit --all --message "$BOT_COMMIT_MESSAGE"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
      - run:
          name: Comment on the pull request
          command: |
            if [ ! -s /tmp/format/formatted.txt ] || [ -z "${PR_NUMBER:-}" ]; then
              exit 0
            fi
            {
              echo "### :robot: Code formatted automatically"
              echo
              echo "clang-format reformatted the following files and pushed a commit (\`$BOT_COMMIT_MESSAGE\`) to this branch:"
              echo
              sed 's/.*/- `&`/' /tmp/format/formatted.txt
              echo
              echo "**Before pushing again**, get this commit with:"
              echo
              echo '```sh'
              echo 'git pull --rebase'
              echo '```'
              echo
              echo "Tip: enable *format on save* in your editor (it reads \`.clang-format\`) and this step will not be needed."
            } > /tmp/format/comment.md
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/format/comment.md

  docs-build:
    executor: python
    steps:
      - checkout
      - skip-unless-changed:
          paths: &docs_paths '^(docs/|doxygen/|zensical\.toml$|requirements-docs\.txt$|\.gitmodules$|scripts/check_docs_nav\.py$|\.circleci/)|\.(hpp|h|cpp)$'
      - run:
          name: Check out submodules
          command: |
            git submodule sync
            git submodule update --init
      - restore_cache:
          keys:
            - pip-docs-{{ checksum "requirements-docs.txt" }}
      - run:
          name: Install tools
          command: |
            pip install -r requirements-docs.txt
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends doxygen
      - save_cache:
          key: pip-docs-{{ checksum "requirements-docs.txt" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Check navigation
          command: python3 scripts/check_docs_nav.py
      - run:
          name: Build guides (Zensical)
          command: zensical build --clean --strict
      - run:
          name: Build API reference (Doxygen)
          command: doxygen doxygen/Doxyfile
      # Read by docs-deploy, which only runs on main
      - when:
          condition:
            equal: [main, << pipeline.git.branch >>]
          steps:
            - persist_to_workspace:
                root: .
                paths:
                  - site

  # GitHub Pages must serve the gh-pages branch (Settings > Pages > Source: Deploy from a branch)
  docs-deploy:
    executor: linux
    resource_class: small
    steps:
      - checkout
      - skip-unless-changed:
          paths: *docs_paths
      - set-repo-slug
      - attach_workspace:
          at: .
      - run:
          name: Deploy to GitHub Pages
          command: |
            bash .circleci/scripts/github-app-token.sh
            source "$BASH_ENV"
            bot_id=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/users/${BOT_SLUG}%5Bbot%5D" | jq -r .id)
            cd site
            touch .nojekyll
            git init -q
            git checkout -q -b gh-pages
            git config user.name "${BOT_SLUG}[bot]"
            git config user.email "${bot_id}+${BOT_SLUG}[bot]@users.noreply.github.com"
            git add --all
            git commit -q --message "docs: deploy $(git -C .. rev-parse --short HEAD) [skip ci]"
            git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

  mirror-check:
    executor: linux
    resource_class: small
    steps:
      - checkout
      - set-repo-slug
      - run:
          name: Check if MIRROR_URL exist
          command: |
            if [ -z "${MIRROR_URL:-}" ]; then
              echo "The variable MIRROR_URL doesn't exist !"
              exit 1
            fi
      - run:
          name: Check that the pipeline does not run on the mirror
          command: |
            MIRROR_REPO=$(echo "$MIRROR_URL" | cut -c 16- | rev | cut -c 5- | rev)
            if [ "$GITHUB_REPOSITORY" = "$MIRROR_REPO" ]; then
              echo "You're trying to run workflow on the mirror repository !"
              exit 1
            fi

  mirror-push:
    executor: linux
    resource_class: small
    steps:
      # Full clone: filter-branch reads every blob of the history
      - checkout:
          method: full
      - run:
          name: Fetch all branches and tags
          command: git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - run:
          name: Create SSH Key
          command: |
            mkdir -p ~/.ssh
            if printf '%s' "$GIT_SSH_PRIVATE_KEY" | grep -q 'BEGIN'; then
              printf '%s\n' "$GIT_SSH_PRIVATE_KEY" > ~/.ssh/mirror_key
            else
              printf '%s' "$GIT_SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/mirror_key
            fi
            chmod 600 ~/.ssh/mirror_key
            ssh-keyscan -t rsa $(echo "$MIRROR_URL" | cut -d':' -f1 | cut -d'@' -f2) >> ~/.ssh/known_hosts
      - run:
          name: Remove CI directories
          command: |
            git filter-branch --force --index-filter 'git rm -r --cached --ignore-unmatch .github .circleci' --prune-empty --tag-name-filter cat -- --all
            git gc --prune=now
            git clean -fd
      - run:
          name: Verify Repository
          command: |
            git fsck --full || echo "Git fsck completed with warnings"
            git gc || echo "Git gc completed with warnings"
      - run:
          name: Push to mirror
          # Only the mirror key: the checkout key of CircleCI must not be offered to the mirror host
          environment:
            GIT_SSH_COMMAND: ssh -F /dev/null -i ~/.ssh/mirror_key -o IdentitiesOnly=yes -o UserKnownHostsFile=~/.ssh/known_hosts
          command: |
            git remote add -f mirror "$MIRROR_URL"
            git push mirror --mirror --prune --force
            echo "Successfully mirrored to $MIRROR_URL"

  check-version:
    executor: linux
    resource_class: small
    environment:
      TAG: << pipeline.git.tag >>
    steps:
      - checkout
      - set-repo-slug
      - run:
          name: Compare the tag with the project version
          command: |
            tag_version="${TAG#v}"
            if ! [[ "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Tag $TAG is not of the form vX.Y.Z or vX.Y.Z-suffix (e.g. v1.0.0, v1.0.0-beta.1)."
              exit 1
            fi
            project_version=$(sed -nE 's/^[[:space:]]+VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -n 1)
            if [ "${tag_version%%-*}" != "$project_version" ]; then
              echo "Tag $TAG does not match the project version $project_version in CMakeLists.txt. Update project(VERSION) first, then tag again."
              exit 1
            fi
            echo "Releasing version $tag_version"
      # A ThreadSanitizer night that failed blocks the release until a run on main passes again: the race fixed,
      # or explained by a suppression in cmake/Sanitizers.cpp
      - run:
          name: Check the last ThreadSanitizer run on main
          command: |
            if [ -z "${CIRCLECI_API_TOKEN:-}" ]; then
              echo "CIRCLECI_API_TOKEN is not set (Project Settings > Environment Variables): cannot read the last ThreadSanitizer night."
              exit 1
            fi
            slug=${CIRCLECI_PROJECT_SLUG:-gh/$GITHUB_REPOSITORY}
            conclusion=$(curl -fsSL -H "Circle-Token: $CIRCLECI_API_TOKEN" \
              "https://circleci.com/api/v2/insights/$slug/workflows/tsan?branch=main" \
              | jq -r '[.items[] | select(.status == "success" or .status == "failed")]
                  | sort_by(.created_at) | reverse | .[0].status // ""')
            if [ "$conclusion" = "failed" ]; then
              echo "The last ThreadSanitizer run on main failed. Fix the race or explain it, then trigger a pipeline on main with nightly-tsan = true."
              exit 1
            fi
            echo "Last ThreadSanitizer run on main: ${conclusion:-none yet}"

  release:
    executor: linux
    resource_class: small
    environment:
      TAG: << pipeline.git.tag >>
    steps:
      - checkout
      - set-repo-slug
      - install-gh
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Compute checksums
          command: |
            mkdir -p dist
            cp /tmp/workspace/packages/r-type-* dist/
            cd dist
            sha256sum r-type-* > SHA256SUMS.txt
            cat SHA256SUMS.txt
      - run:
          name: Create the release
          command: |
            bash .circleci/scripts/github-app-token.sh
            source "$BASH_ENV"
            prerelease=""
            if [[ "$TAG" == *-* ]]; then
              prerelease="--prerelease"
            fi
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "R-Type ${TAG#v}" \
              --generate-notes \
              --verify-tag \
              $prerelease

# Conditions written as logic statements: a pipeline value missing from the event (such as the tag of a branch
# pipeline) is then an empty string, whereas an expression compares it as null and never matches ""
workflows:
  # Branch pipelines only: the branch is empty on tag pipelines
  build:
    when:
      and:
        - not: << pipeline.parameters.nightly-tsan >>
        - not:
            equal: [pull_request, << pipeline.event.name >>]
        - not:
            equal: ["", << pipeline.git.branch >>]
        - not:
            equal: [gh-pages, << pipeline.git.branch >>]
    jobs:
      - panel
      - build-linux:
          requires:
            - panel
      - build-windows:
          requires:
            - panel

  sanitizers:
    when:
      and:
        - not: << pipeline.parameters.nightly-tsan >>
        - not:
            equal: [pull_request, << pipeline.event.name >>]
        - not:
            equal: ["", << pipeline.git.branch >>]
        - not:
            equal: [gh-pages, << pipeline.git.branch >>]
    jobs:
      - sanitizers:
          name: sanitizers-address-undefined
          sanitizers: address,undefined

  # The nightly schedule (or a pipeline triggered by hand with nightly-tsan = true). Its name is read by the
  # release, through the Insights API
  tsan:
    when: << pipeline.parameters.nightly-tsan >>
    jobs:
      - sanitizers:
          name: sanitizers-thread
          sanitizers: thread

  # Built and smoke tested on every branch, published from main and the v* tags
  docker:
    when:
      and:
        - not: << pipeline.parameters.nightly-tsan >>
        - not:
            equal: [pull_request, << pipeline.event.name >>]
        - not:
            equal: [gh-pages, << pipeline.git.branch >>]
    jobs:
      - docker-image:
          filters: pipeline.git.branch != "" or pipeline.git.tag starts-with "v"
      - docker-publish:
          matrix:
            parameters:
              arch: [amd64, arm64]
          requires:
            - docker-image
          filters: pipeline.git.branch == "main" or pipeline.git.tag starts-with "v"
      - docker-manifest:
          requires:
            - docker-publish
          filters: pipeline.git.branch == "main" or pipeline.git.tag starts-with "v"
          serial-group: rtype/docker-publish

  format:
    when:
      and:
        - not: << pipeline.parameters.nightly-tsan >>
        - not:
            equal: ["", << pipeline.git.branch >>]
        - not:
            equal: [gh-pages, << pipeline.git.branch >>]
    jobs:
      # Not cancelled: a run that just pushed a fix must still be able to post its comment
      - format:
          serial-group: rtype/format/<< pipeline.git.branch >>

  docs:
    when:
      and:
        - not: << pipeline.parameters.nightly-tsan >>
        - not:
            equal: ["", << pipeline.git.branch >>]
        - not:
            equal: [gh-pages, << pipeline.git.branch >>]
    jobs:
      - docs-build:
          serial-group: rtype/docs/<< pipeline.git.branch >>
      - docs-deploy:
          requires:
            - docs-build
          filters: pipeline.event.name != "pull_request" and pipeline.git.branch == "main"
          serial-group: rtype/pages

  mirror:
    when:
      and:
        - not: << pipeline.parameters.nightly-tsan >>
        - equal: [push, << pipeline.event.name >>]
        - equal: [main, << pipeline.git.branch >>]
    jobs:
      - mirror-check
      - mirror-push:
          requires:
            - mirror-check

  release:
    when:
      matches:
        pattern: "^v.*"
        value: << pipeline.git.tag >>
    jobs:
      - check-version:
          filters: pipeline.git.tag starts-with "v"
      - panel:
          requires:
            - check-version
          filters: pipeline.git.tag starts-with "v"
      - build-linux:
          requires:
            - panel
          filters: pipeline.git.tag starts-with "v"
      - build-windows:
          requires:
            - panel
          filters: pipeline.git.tag starts-with "v"
      - release:
          requires:
            - build-linux
            - build-windows
          filters: pipeline.git.tag starts-with "v"
