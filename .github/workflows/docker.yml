name: Docker

# The image of the server (docs/guides/deploy-with-docker.md): built and tested on every pull request, then
# published on GHCR for linux/amd64 and linux/arm64 from main (tag main) and from the tags of the releases
# (their version, and latest), which Dokploy pulls
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: Image
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: write
    env:
      SERVER_IMAGE: rtype-server:ci-${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_IMAGE: rtype-smoke:ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # BuildKit keeps the downloads of CPM and the build folder in its cache mounts, on this runner. The build
      # folder is one per branch: shared, it would hold objects of another branch that Ninja finds up to date
      - name: Build the image
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if ! command -v docker >/dev/null || ! docker info >/dev/null 2>&1; then
            echo "::error::No Docker on this runner. See docs/contributing/testing.md#runners"
            exit 1
          fi
          cache=$(printf '%s' "$BRANCH" | tr -c 'A-Za-z0-9_.-' '-')
          docker build --build-arg BUILD_CACHE="$cache" --target server -t "$SERVER_IMAGE" .
          docker build --build-arg BUILD_CACHE="$cache" --target smoke -t "$SMOKE_IMAGE" .

      - name: Smoke test
        run: docker/smoke-test.sh "$SERVER_IMAGE" "$SMOKE_IMAGE"

      # The settings of the official server, a fake Discord and a fake mail server: a player and an
      # administrator sign in
      - name: Smoke test with accounts
        run: docker/smoke-test-accounts.sh "$SERVER_IMAGE" "$SMOKE_IMAGE"

      # The image for linux/amd64 and linux/arm64 in one manifest, Dokploy pulls the one of its machine. arm64
      # is built under QEMU, slower, and only here: the smoke tests above run on amd64. The builder keeps its
      # cache mounts on this runner, from one publication to the next
      - name: Publish on GHCR
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BUILDER: rtype-multi-arch
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/rtype-server"
          if [ "$REF_TYPE" = tag ]; then
            tags=("${REF_NAME#v}")
            # A prerelease never becomes latest
            [[ "$REF_NAME" == *-* ]] || tags+=(latest)
          else
            tags=(main)
          fi
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(-t "$image:$tag")
          done
          docker run --privileged --rm tonistiigi/binfmt --install arm64
          docker buildx inspect "$BUILDER" >/dev/null 2>&1 \
            || docker buildx create --name "$BUILDER" --driver docker-container
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx build --builder "$BUILDER" --platform linux/amd64,linux/arm64 --target server \
            "${tag_args[@]}" --push .
          docker logout ghcr.io

      - name: Remove the images
        if: always()
        run: docker rmi -f "$SERVER_IMAGE" "$SMOKE_IMAGE" >/dev/null 2>&1 || true
