name: Docker

# The image of the server (docs/guides/deploy-with-docker.md): built and tested on every pull request, then
# published on GHCR from main (tag main) and from the tags of the releases (their version, and latest), which
# Dokploy pulls
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  image:
    name: Image
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: write
    env:
      SERVER_IMAGE: rtype-server:ci-${{ github.run_id }}-${{ github.run_attempt }}
      SMOKE_IMAGE: rtype-smoke:ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # BuildKit keeps the downloads of CPM and the build folder in its cache mounts, on this runner
      - name: Build the image
        run: |
          if ! command -v docker >/dev/null || ! docker info >/dev/null 2>&1; then
            echo "::error::No Docker on this runner. See docs/contributing/testing.md#runners"
            exit 1
          fi
          docker build --target server -t "$SERVER_IMAGE" .
          docker build --target smoke -t "$SMOKE_IMAGE" .

      - name: Smoke test
        run: docker/smoke-test.sh "$SERVER_IMAGE" "$SMOKE_IMAGE"

      - name: Publish on GHCR
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "$REF_TYPE" = tag ]; then
            tags=("${REF_NAME#v}")
            # A prerelease never becomes latest
            [[ "$REF_NAME" == *-* ]] || tags+=(latest)
          else
            tags=(main)
          fi
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in "${tags[@]}"; do
            docker tag "$SERVER_IMAGE" "$image:$tag"
            docker push "$image:$tag"
            docker rmi "$image:$tag"
          done
          docker logout ghcr.io

      - name: Remove the images
        if: always()
        run: docker rmi -f "$SERVER_IMAGE" "$SMOKE_IMAGE" >/dev/null 2>&1 || true
