name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compare the tag with the project version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          tag_version="${TAG#v}"
          if ! [[ "$tag_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $TAG is not of the form vX.Y.Z or vX.Y.Z-suffix (e.g. v1.0.0, v1.0.0-beta.1)."
            exit 1
          fi
          project_version=$(sed -nE 's/^[[:space:]]+VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -n 1)
          if [ "${tag_version%%-*}" != "$project_version" ]; then
            echo "::error::Tag $TAG does not match the project version $project_version in CMakeLists.txt. Update project(VERSION) first, then tag again."
            exit 1
          fi
          echo "Releasing version $tag_version"

      # A ThreadSanitizer night that failed blocks the release until a run on main passes again: the race fixed,
      # or explained by a suppression in cmake/Sanitizers.cpp
      - name: Check the last ThreadSanitizer run on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow tsan.yml --branch main --limit 20 \
            --json conclusion --jq 'map(select(.conclusion == "success" or .conclusion == "failure"))[0].conclusion // ""')
          if [ "$conclusion" = "failure" ]; then
            echo "::error::The last ThreadSanitizer run on main failed. Fix the race or explain it, then run the Thread sanitizer workflow on main again."
            exit 1
          fi
          echo "Last ThreadSanitizer run on main: ${conclusion:-none yet}"

  build:
    name: Build
    needs: check-version
    uses: ./.github/workflows/build.yml

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: r-type-*
          path: dist
          merge-multiple: true

      - name: Compute checksums
        working-directory: dist
        run: |
          sha256sum r-type-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          if [[ "$TAG" == *-* ]]; then
            prerelease="--prerelease"
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "R-Type ${TAG#v}" \
            --generate-notes \
            --verify-tag \
            $prerelease
