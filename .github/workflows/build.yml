name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  # The administration panel (web/admin): its own toolchain, Node LTS, apart from the game. Its dist/ goes into
  # the server package of each system; the game itself builds without Node
  panel:
    name: Panel
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: web/admin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: |
          npm run lint
          npm run format:check

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload the panel
        uses: actions/upload-artifact@v7
        with:
          name: admin-panel
          path: web/admin/dist
          if-no-files-found: error

  build:
    name: Build (${{ matrix.name }})
    needs: panel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: [self-hosted, linux]
            generator: Ninja
          - name: windows
            os: [self-hosted, windows]
            generator: Visual Studio 17 2022

    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Where the end-to-end tests serve it from, and the package takes it
      - name: Download the panel
        uses: actions/download-artifact@v8
        with:
          name: admin-panel
          path: web/admin/dist

      # The second line is what the Chromium of Playwright needs, for the end-to-end tests of the panel: named
      # here since `playwright install --with-deps` runs `sudo sh`, and knows only the packages of Ubuntu
      - name: Install system libraries (X11 / OpenGL, OpenSSL, libpq, Chromium)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libssl-dev libpq-dev \
            libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libdbus-1-3 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2t64 \
            libatspi2.0-0t64

      # The tests of the database run on SQLite and on this PostgreSQL. Windows tests SQLite only
      - name: Start PostgreSQL for the tests
        if: runner.os == 'Linux'
        uses: ./.github/actions/start-postgresql

      - name: Restore dependency cache
        uses: actions/cache@v6
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/**', '**/CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-

      - name: Configure
        run: >
          cmake -S . -B build -G "${{ matrix.generator }}"
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DRTYPE_BUILD_TESTS=ON
          -DRTYPE_ADMIN_PANEL_DIR="${{ github.workspace }}/web/admin/dist"

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ env.BUILD_TYPE }} --output-on-failure

      # The panel against the master just built and a game of real players. Node comes from setup-node, the
      # libraries of Chromium from the system libraries above, Chromium itself from Playwright
      - name: Set up Node for the end-to-end tests of the panel
        if: runner.os == 'Linux'
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/admin/package-lock.json

      - name: End-to-end tests of the panel
        if: runner.os == 'Linux'
        working-directory: web/admin
        env:
          RTYPE_BUILD_BIN: ${{ github.workspace }}/build/bin
        run: |
          npm ci
          npx playwright install chromium
          npx playwright test

      - name: Upload the report of the end-to-end tests
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web/admin/playwright-report
          if-no-files-found: ignore

      - name: Stop PostgreSQL
        if: always() && env.POSTGRES_CONTAINER != ''
        run: docker rm -f "${{ env.POSTGRES_CONTAINER }}"

      - name: Package
        working-directory: build
        run: cpack -C ${{ env.BUILD_TYPE }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: r-type-${{ matrix.name }}
          path: |
            build/r-type-*.zip
            build/r-type-*.tar.gz
          if-no-files-found: error
