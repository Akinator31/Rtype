name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: [self-hosted, linux]
            generator: Ninja
          - name: windows
            os: [self-hosted, windows]
            generator: Visual Studio 17 2022

    env:
      CPM_SOURCE_CACHE: ${{ github.workspace }}/.cpm-cache

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system libraries (X11 / OpenGL, libpq)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libpq-dev

      # A PostgreSQL of its own for the tests of the database, on a free port, removed at the end. Without Docker
      # on the runner, those tests run on SQLite only
      - name: Start PostgreSQL for the tests
        if: runner.os == 'Linux'
        run: |
          if ! command -v docker >/dev/null || ! docker info >/dev/null 2>&1; then
            echo "::notice::No Docker on this runner: the database is tested on SQLite only"
            exit 0
          fi
          name="rtype-ci-postgres-${{ github.run_id }}-${{ github.run_attempt }}"
          docker run -d --name "$name" -e POSTGRES_USER=rtype -e POSTGRES_PASSWORD=rtype -e POSTGRES_DB=rtype \
            -p 127.0.0.1::5432 postgres:18
          # Over TCP: while it initializes, the image runs a server on its Unix socket only, then restarts it
          for attempt in $(seq 1 30); do
            docker exec "$name" pg_isready -h 127.0.0.1 -U rtype -d rtype >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec "$name" pg_isready -h 127.0.0.1 -U rtype -d rtype
          port=$(docker port "$name" 5432/tcp | head -n 1 | sed 's/.*://')
          echo "POSTGRES_CONTAINER=$name" >> "$GITHUB_ENV"
          echo "RTYPE_TEST_POSTGRESQL_URL=postgresql://rtype:rtype@127.0.0.1:$port/rtype" >> "$GITHUB_ENV"

      - name: Restore dependency cache
        uses: actions/cache@v6
        with:
          path: .cpm-cache
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/**', '**/CMakeLists.txt') }}
          restore-keys: cpm-${{ runner.os }}-

      - name: Configure
        run: >
          cmake -S . -B build -G "${{ matrix.generator }}"
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DRTYPE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Test
        run: ctest --test-dir build -C ${{ env.BUILD_TYPE }} --output-on-failure

      - name: Stop PostgreSQL
        if: always() && env.POSTGRES_CONTAINER != ''
        run: docker rm -f "${{ env.POSTGRES_CONTAINER }}"

      - name: Package
        working-directory: build
        run: cpack -C ${{ env.BUILD_TYPE }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: r-type-${{ matrix.name }}
          path: |
            build/r-type-*.zip
            build/r-type-*.tar.gz
          if-no-files-found: error
